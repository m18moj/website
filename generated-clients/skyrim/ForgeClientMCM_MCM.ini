; ForgeClientMCM_MCM.ini
; Companion metadata file for SkyUI's Mod Configuration Menu (MCM) system.
; This file must sit next to the compiled ForgeClientMCM.pex quest script's
; parent .esp (i.e. in the same Data\ folder) using the exact base name
; "<YourPluginName>_MCM.ini" is NOT required for script-based (SKI_ConfigBase)
; menus — MCM auto-discovers any quest with an attached SKI_ConfigBase script
; — but this file is still read by MCM for the metadata below and is the
; standard convention distributed alongside script-driven MCM menus.

[General]
ModName = ScriptForge Client
MCMID = ForgeClientMCM
MinMenuVersion = 6
Priority = 0

; Pages listed here match the Pages[] array built in ForgeClientMCM.psc's
; OnConfigInit() event. They are documented here for reference/tooling only;
; the actual page contents are generated at runtime by OnPageReset().

[Page1]
Name = Followers & Home

[Page2]
Name = Crime & Reputation

[Page3]
Name = Progression

[Page4]
Name = World & Economy
