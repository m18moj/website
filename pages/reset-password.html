<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set a new password for your ScripForge account.">
    <title>Reset Password | ScripForge</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/theme.js"></script>
    <script src="../js/error-reporter.js"></script>
</head>
<body data-root-prefix="../">
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <svg class="logo-icon" viewBox="0 0 40 40" aria-hidden="true">
                    <rect x="5" y="5" width="12" height="12" fill="#00d9ff"/>
                    <rect x="23" y="5" width="12" height="12" fill="#a855f7"/>
                    <rect x="5" y="23" width="12" height="12" fill="#a855f7"/>
                    <rect x="23" y="23" width="12" height="12" fill="#00d9ff"/>
                </svg>
                ScripForge
            </a>
            <div class="nav-menu" id="navMenu">
                <a href="games" class="nav-link">Games</a>
                <a href="services" class="nav-link">Services</a>
                <a href="https://discord.gg/Hr69adj2My" target="_blank" rel="noreferrer" class="nav-link">Discord</a>
            </div>
            <div class="nav-actions">
                <span id="authControl" class="auth-control"></span>
                <a href="checkout" class="cart-btn" aria-label="View basket">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count">0</span>
                </a>
                <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <main class="page-shell">
        <div class="container breadcrumbs" aria-label="Breadcrumb">
            <a href="/">Home</a> / <a href="login">Sign In</a> / <span>Reset Password</span>
        </div>
        <div class="page-header">
            <p class="eyebrow">Account</p>
            <h1>Set a new password</h1>
            <p>Choose a new password for your account.</p>
        </div>

        <div class="container">
            <div class="auth-form-panel" id="resetPanel">
                <form id="resetForm" novalidate>
                    <div class="form-group">
                        <label for="newPassword">New password</label>
                        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
                        <small>At least 8 characters.</small>
                    </div>
                    <p id="formError" class="form-error" role="alert" hidden></p>
                    <button class="btn btn-primary" type="submit">Update password</button>
                </form>
            </div>
            <div class="auth-form-panel" id="invalidPanel" hidden>
                <p>This reset link is missing or invalid. Request a new one from the sign-in page.</p>
                <p class="auth-switch"><a href="forgot-password">Request a new link</a></p>
            </div>
        </div>
    </main>

    <script src="../js/site.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/currency.js"></script>
    <script src="../js/site-flags.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/reset-password.js"></script>
    <script src="../js/chat-widget.js" defer></script>
  </body>
</html>
